<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-CCG8uL4+eqdnWv58X0gtyivUPcLdZu8ZGPw2D0nV94Q='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лаборатория сечений</title>
<meta name="description" content="Виртуальная 3D-лаборатория по построению сечений многогранников методом следов: три уровня сложности, подсказки и автоматическая проверка.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M8 14 L22 8 L33 13 L33 29 L19 35 L8 30 Z' fill='none' stroke='%231b2631' stroke-width='3'/%3E%3Cpath d='M8 22 L26 10.5 L33 21 L14 32.5 Z' fill='%23cf3f2a' fill-opacity='.4' stroke='%23cf3f2a' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=PT+Serif:ital,wght@1,400;1,700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Макет: чертёжный стол — слева задачи, в центре 3D-сцена на миллиметровке, справа условие, подсказки и журнал построений */
:root {
  --bg: #e9edf0;
  --paper: #f7f9fa;
  --ink: #1b2631;
  --muted: #5c6a77;
  --rule: #c9d2d9;
  --grid: #dbe2e7;
  --face: #6f8aa3;
  --accent: #2248c9;
  --accent-soft: #dfe6fb;
  --section: #cf3f2a;
  --section-soft: #f8e1dc;
  --ok: #1d7f4e;
  --warn: #a8640f;
  --sel: #e08a00;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-math: "PT Serif", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --paper: #182028; --ink: #e2e8ee; --muted: #93a1ad; --rule: #2b3640; --grid: #1d262e;
    --face: #8fa9c2; --accent: #7d9bff; --accent-soft: #1f2a4a; --section: #ff7b5e; --section-soft: #3a211c;
    --ok: #4cc58a; --warn: #e3a94b; --sel: #ffb238; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --paper: #182028; --ink: #e2e8ee; --muted: #93a1ad; --rule: #2b3640; --grid: #1d262e;
  --face: #8fa9c2; --accent: #7d9bff; --accent-soft: #1f2a4a; --section: #ff7b5e; --section-soft: #3a211c;
  --ok: #4cc58a; --warn: #e3a94b; --sel: #ffb238; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 270px minmax(0, 1fr) 340px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top top" "tasks stage panel";
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { grid-area: top; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 38px; height: 38px; flex: none; }
.brand h1 { font: 700 19px/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase; }

.levels { display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; padding: 4px; }
.levels button {
  border: 0; background: transparent; border-radius: 999px; padding: 7px 14px 7px 12px; cursor: pointer;
  display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--muted);
}
.levels button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 4px; height: 12px; border-radius: 1px; background: currentColor; opacity: 0.25; }
.pips i.on { opacity: 1; }

.tasks, .panel { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); min-height: 0; overflow: auto; }
.tasks { grid-area: tasks; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.panel { grid-area: panel; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
h2, h3 { margin: 0; font: 600 11.5px/1.2 var(--font-body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.level-note { margin: 0; font-size: 13.5px; color: var(--muted); }

.task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.task-list button {
  width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 8px;
  padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center;
}
.task-list button:hover { background: var(--bg); }
.task-list button[aria-current="true"] { border-color: var(--ink); background: var(--bg); }
.task-list .no { font: 500 12px var(--font-mono); color: var(--muted); }
.task-list .nm { display: flex; flex-direction: column; min-width: 0; }
.task-list .nm b { font-weight: 500; font-size: 14px; }
.task-list .nm span { font: italic 14px var(--font-math); color: var(--muted); }
.stars { font-size: 12px; letter-spacing: 1px; color: var(--warn); white-space: nowrap; }
.stars .off { color: var(--rule); }

.gen { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px dashed var(--rule); }
select, .btn {
  border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 8px 12px; cursor: pointer;
  font: 500 14px var(--font-body); color: var(--ink);
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.primary:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.legend { margin-top: auto; display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 18px; height: 0; border-top: 2px solid var(--ink); flex: none; }
.legend i.dash { border-top-style: dashed; border-top-width: 1.5px; }
.legend i.acc { border-color: var(--accent); }
.legend i.dot { width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--section); margin: 0 4.5px; }
.legend i.dot.b { background: var(--accent); }

.stage {
  grid-area: stage; position: relative; border-radius: var(--r); border: 1px solid var(--rule); overflow: hidden; min-height: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px;
  background-blend-mode: normal;
  touch-action: none;
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.stage canvas.hit { cursor: pointer; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; left: 0; top: 0; font: italic 700 16px/1 var(--font-math); color: var(--ink); white-space: nowrap;
  text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper), 0 0 6px var(--paper);
}
.lbl.given { color: var(--section); }
.lbl.built { color: var(--accent); font-size: 15px; }
.lbl.dim { opacity: 0.5; }

.toolbar {
  position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none;
}
.tool {
  pointer-events: auto; display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 9px; border-radius: 8px;
  background: var(--paper); border: 1px solid var(--rule); cursor: pointer; font-weight: 500; font-size: 14px;
}
.tool svg { width: 20px; height: 20px; flex: none; }
.tool kbd { font: 500 11px var(--font-mono); color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; }
.tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tool[aria-pressed="true"] kbd { color: #fff; border-color: rgba(255,255,255,.5); }
.tool[data-tool="section"][aria-pressed="true"] { background: var(--section); border-color: var(--section); }
.view-btns { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; }
.view-btns .btn { padding: 6px 10px; font-size: 13px; }

.status {
  position: absolute; left: 12px; bottom: 12px; right: 170px; max-width: 640px; padding: 9px 12px; border-radius: 8px;
  background: var(--paper); border: 1px solid var(--rule); font-size: 14px; border-left: 4px solid var(--accent);
}
.status.ok { border-left-color: var(--ok); }
.status.err { border-left-color: var(--section); }
.status.warn { border-left-color: var(--warn); }
.status .m { font-family: var(--font-math); font-style: italic; }
.tip {
  position: absolute; pointer-events: none; padding: 3px 8px; border-radius: 6px; background: var(--ink); color: var(--paper);
  font-size: 12.5px; transform: translate(14px, 10px); white-space: nowrap;
}

.task-card { display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 12px var(--font-body); padding: 3px 9px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.chip.lv1 { background: var(--accent-soft); color: var(--accent); }
.chip.lv3 { background: var(--section-soft); color: var(--section); }
.statement { margin: 0; font-size: 16px; line-height: 1.45; text-wrap: pretty; }
.m { font-family: var(--font-math); font-style: italic; }
.pdesc { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font: italic 15px var(--font-math); }
.pdesc li::before { content: "•"; color: var(--section); margin-right: 8px; font-style: normal; }
.vcount { margin: 0; font-size: 13.5px; color: var(--muted); }

.result { font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--bg); }
.result.ok { background: color-mix(in srgb, var(--ok) 14%, var(--paper)); }
.result.err { background: var(--section-soft); }
.result b { font-weight: 600; }

.hints { display: flex; flex-direction: column; gap: 10px; }
.hint-list { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 14px; }
.hint-list li::marker { font: 500 12px var(--font-mono); color: var(--muted); }
.hint-cost { font-size: 12.5px; color: var(--muted); margin: 0; }

.log { display: flex; flex-direction: column; gap: 8px; }
.log ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font: 13px var(--font-mono); color: var(--muted); counter-reset: s; }
.log li { counter-increment: s; display: flex; gap: 8px; }
.log li::before { content: counter(s, decimal-leading-zero); color: var(--rule); }
.log li span { color: var(--ink); }
.log .empty { font: 13.5px var(--font-body); }
.log .empty::before { content: none; }

@media (max-width: 1100px) {
  .app { grid-template-columns: 240px minmax(0, 1fr); grid-template-areas: "top top" "tasks stage" "panel panel"; grid-template-rows: auto minmax(460px, 1fr) auto; height: auto; min-height: 100%; }
  .panel { overflow: visible; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "stage" "panel" "tasks"; grid-template-rows: auto 68vh auto auto; }
  .tasks, .panel { overflow: visible; }
  .levels { width: 100%; }
  .levels button { flex: 1; justify-content: center; padding-inline: 8px; }
  .tool { padding: 6px 9px 6px 7px; font-size: 13px; }
  .tool kbd { display: none; }
  .status { right: 12px; bottom: 56px; }
  .legend { margin-top: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .tool, .btn, .task-list button, .levels button { transition: background-color .15s, border-color .15s, color .15s; }
}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M8 14 L22 8 L33 13 L33 29 L19 35 L8 30 Z" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
        <path d="M8 14 L19 19 L33 13 M19 19 L19 35" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="2.5 2"/>
        <path d="M8 22 L26 10.5 L33 21 L14 32.5 Z" fill="var(--section)" fill-opacity=".3" stroke="var(--section)" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>Лаборатория сечений</h1>
        <p>Стереометрия · метод следов</p>
      </div>
    </div>
    <nav class="levels" role="tablist" aria-label="Уровень сложности">
      <button role="tab" data-level="1" id="lv1"><span class="pips"><i class="on"></i><i></i><i></i></span>Базовый</button>
      <button role="tab" data-level="2" id="lv2"><span class="pips"><i class="on"></i><i class="on"></i><i></i></span>Средний</button>
      <button role="tab" data-level="3" id="lv3"><span class="pips"><i class="on"></i><i class="on"></i><i class="on"></i></span>Сложный</button>
    </nav>
  </header>

  <aside class="tasks" aria-label="Задачи">
    <h2>Задачи уровня</h2>
    <p class="level-note" id="levelNote"></p>
    <ol class="task-list" id="taskList"></ol>
    <div class="gen">
      <h2>Своя задача</h2>
      <select id="genPoly" aria-label="Многогранник">
        <option value="">Любой многогранник</option>
        <option value="cube">Куб</option>
        <option value="tetra">Треугольная пирамида</option>
        <option value="pyr4">Четырёхугольная пирамида</option>
        <option value="prism">Треугольная призма</option>
      </select>
      <button class="btn" id="genBtn">Сгенерировать задачу</button>
    </div>
    <div class="legend" aria-label="Обозначения">
      <div><i></i>видимое ребро</div>
      <div><i class="dash"></i>невидимое ребро, продолжение</div>
      <div><i class="acc"></i>ваши построения</div>
      <div><i class="dot"></i>данные точки</div>
      <div><i class="dot b"></i>построенные точки</div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <div id="labels"></div>
    <div class="toolbar" role="toolbar" aria-label="Инструменты">
      <button class="tool" data-tool="line" aria-pressed="true" title="Прямая через две точки">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 16 L18 4" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="13" r="2.2" fill="currentColor"/><circle cx="14" cy="7" r="2.2" fill="currentColor"/></svg>
        Прямая <kbd>1</kbd></button>
      <button class="tool" data-tool="intersect" aria-pressed="false" title="Точка пересечения двух прямых">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 4 L18 16 M2 15 L18 6" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/></svg>
        Пересечение <kbd>2</kbd></button>
      <button class="tool" data-tool="parallel" aria-pressed="false" title="Прямая через точку параллельно прямой">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 12 L14 3 M6 17 L18 8" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12.5" r="2.2" fill="currentColor"/></svg>
        Параллель <kbd>3</kbd></button>
      <button class="tool" data-tool="section" aria-pressed="false" title="Отметить вершины сечения">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9 L11 3 L17 9 L9 17 Z" fill="currentColor" fill-opacity=".35" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Сечение <kbd>4</kbd></button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="view-btns">
      <button class="btn" id="undoBtn" title="Отменить (Ctrl+Z)">Отменить</button>
      <button class="btn" id="viewBtn" title="Вернуть исходный ракурс">Ракурс</button>
    </div>
    <div class="tip" id="tip" hidden></div>
  </main>

  <section class="panel" aria-label="Условие и подсказки">
    <div class="task-card">
      <div class="chips" id="chips"></div>
      <p class="statement" id="statement"></p>
      <ul class="pdesc" id="pdesc"></ul>
      <p class="vcount" id="vcount"></p>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="checkBtn">Проверить сечение</button>
      <button class="btn" id="clearBtn">Начать заново</button>
    </div>
    <div class="result" id="result" hidden></div>
    <div class="hints">
      <h3>Подсказки</h3>
      <p class="hint-cost" id="hintCost"></p>
      <ol class="hint-list" id="hintList"></ol>
      <div class="btn-row">
        <button class="btn" id="hintBtn">Следующая подсказка</button>
        <button class="btn" id="solveBtn">Показать решение</button>
      </div>
    </div>
    <div class="log">
      <h3>Журнал построений</h3>
      <ol id="log"></ol>
    </div>
  </section>
</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>

</body>
</html>
